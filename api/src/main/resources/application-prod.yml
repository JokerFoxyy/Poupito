# Perfil de produção — ativar com SPRING_PROFILES_ACTIVE=prod
# Segredos NÃO têm default aqui: o SecretsValidator falha o startup se não vierem do ambiente.
app:
  security:
    cookie-secure: true
  frontend:
    # link do email de reset aponta pro domínio real
    reset-url-base: ${FRONTEND_RESET_URL:https://poupito.com/redefinir-senha}
  mail:
    # ligar quando o SES estiver configurado (ver D:/Docs/Poupito/setup-ses-email.md)
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:nao-responda@poupito.com}

# SMTP do AWS SES — só usado quando app.mail.enabled=true (credenciais via env)
spring:
  mail:
    host: ${MAIL_HOST:email-smtp.us-east-1.amazonaws.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  # Tuning pra instância pequena (Lightsail 1GB, Postgres no mesmo host — sessão #24):
  # pool/threads enxutos evitam que a API sozinha esgote memória/conexões que o
  # Postgres também precisa. Valores pequenos de propósito, não é sub-dimensionamento
  # acidental.
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}

server:
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:50}
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:10}

# Swagger/OpenAPI desligados em produção (não expor o contrato publicamente)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
