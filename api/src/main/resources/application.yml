server:
  servlet:
    context-path: /api

spring:
  application:
    name: poupito-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/poupito}
    username: ${DB_USER:poupito}
    password: ${DB_PASSWORD:poupito-dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:poupito-dev-secret-do-not-use-in-production-0123456789}
    access-expiration: ${JWT_ACCESS_EXPIRATION:PT15M}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:P30D}
  security:
    cookie-secure: ${COOKIE_SECURE:false}
    rate-limit:
      max-attempts: ${AUTH_RATE_LIMIT_MAX:10}
      window: ${AUTH_RATE_LIMIT_WINDOW:PT1M}
    lockout:
      max-failures: ${LOGIN_LOCKOUT_MAX:5}
      window: ${LOGIN_LOCKOUT_WINDOW:PT5M}
    # Rate limit geral da API (sessão #24) — cobre todo endpoint, não só login/registro.
    # "expensive" vale pra export de transações e import de planilha (mais caros de CPU/IO).
    api-rate-limit:
      default:
        max-requests: ${API_RATE_LIMIT_DEFAULT_MAX:120}
        window: ${API_RATE_LIMIT_DEFAULT_WINDOW:PT1M}
      expensive:
        max-requests: ${API_RATE_LIMIT_EXPENSIVE_MAX:10}
        window: ${API_RATE_LIMIT_EXPENSIVE_WINDOW:PT1M}
  password-reset:
    ttl: ${PASSWORD_RESET_TTL:PT30M}
  frontend:
    reset-url-base: ${FRONTEND_RESET_URL:http://localhost:4200/redefinir-senha}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:nao-responda@poupito.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
