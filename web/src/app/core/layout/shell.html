<div class="layout">
  <button class="menu-toggle" type="button" (click)="toggleSidebar()" aria-label="Abrir menu">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6" />
      <line x1="3" y1="12" x2="21" y2="12" />
      <line x1="3" y1="18" x2="21" y2="18" />
    </svg>
  </button>
  @if (sidebarOpen()) {
    <div class="sidebar-backdrop" (click)="closeSidebar()"></div>
  }
  <aside [class.open]="sidebarOpen()">
    <div class="logo">Poup<span>ito</span></div>
    <nav>
      @for (item of navItems; track item.path) {
        <a class="nav-item" [routerLink]="item.path" routerLinkActive="active" (click)="closeSidebar()">
          <span>{{ item.icon }}</span> {{ item.label }}
          @if (item.path === '/orcamentos' && budgetAlertCount() > 0) {
            <span class="alert-badge">{{ budgetAlertCount() }}</span>
          }
        </a>
      }
    </nav>
    <div class="sidebar-footer">
      @if (currentUser(); as user) {
        <div class="user-email" [title]="user.email">{{ user.email }}</div>
      }
      <button class="theme-toggle" type="button" (click)="toggleTheme()">
        @if (theme() === 'dark') {
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" /><line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" /><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" /><line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" /><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
          Tema claro
        } @else {
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          Tema escuro
        }
      </button>
      <button class="logout-btn" (click)="logout()">Sair</button>
    </div>
  </aside>
  <main>
    <router-outlet />
  </main>
</div>
